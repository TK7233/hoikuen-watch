name: 保育園空き状況チェック

on:
  schedule:
    # 07:00-20:00(日本時間)を10分おきにチェック
    # 日本時間 = UTC+9 なので UTC 22:00-23:59 と 00:00-11:00 に相当
    - cron: "*/10 22-23 * * *"
    - cron: "*/10 0-11 * * *"
    # 念のため上記時間帯外にも1回/日フォールバックチェック(日本時間 21:00)
    - cron: "0 12 * * *"
  workflow_dispatch: {} # 手動実行もできるようにしておく

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r scripts/requirements.txt

      - name: チェック実行
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python scripts/check_hoikuen.py

      - name: 状態ファイルの変更をコミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update last_pdf.txt"
          file_pattern: state/last_pdf.txt
